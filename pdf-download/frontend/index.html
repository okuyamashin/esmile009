<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>esmile009 PDFダウンロード</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #fff;
      --line: #dbe3ef;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic UI", sans-serif;
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 16px 20px 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.25rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    select, input[type="search"] {
      min-height: 40px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
    }

    input[type="search"] { min-width: 220px; }

    .check-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      color: var(--text);
      font-size: 0.9rem;
    }

    .client-filters {
      margin-top: 12px;
    }

    .client-filters-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      max-height: 96px;
      overflow: auto;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .client-filters-list label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      font-size: 0.82rem;
    }

    button {
      min-height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .meta, .status, .error {
      margin: 8px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .error { color: var(--danger); }

    main { padding: 0 0 40px; }

    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 280px);
      background: var(--card);
      border-top: 1px solid var(--line);
    }

    table {
      border-collapse: collapse;
      min-width: 100%;
      font-size: 0.78rem;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid #eef2f7;
      padding: 6px 8px;
      white-space: nowrap;
      vertical-align: top;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eef4ff;
      text-align: left;
      font-weight: 600;
    }

    .col-check, .col-pdf {
      position: sticky;
      left: 0;
      z-index: 1;
      background: #fff;
    }

    th.col-check, th.col-pdf { z-index: 3; background: #eef4ff; }
    .col-pdf { left: 36px; }
    tr:nth-child(even) .col-check,
    tr:nth-child(even) .col-pdf { background: #f8fafc; }

    tbody tr.no-pdf { color: #9ca3af; }
    tbody tr.selected td { background: #eff6ff; }
    tbody tr.selected .col-check,
    tbody tr.selected .col-pdf { background: #dbeafe; }

    th.col-num, td.col-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
    }

    th.sortable:hover { background: #dbe7ff; }

    th.sortable .sort-mark {
      margin-left: 4px;
      color: var(--muted);
      font-weight: 400;
    }

    .col-pdf a.pdf-link {
      color: #1d4ed8;
      text-decoration: none;
    }

    .col-pdf a.pdf-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>esmile009 PDFダウンロード</h1>
    <div class="toolbar">
      <label>
        日付ディレクトリ
        <select id="date-select"></select>
      </label>
      <label>
        絞り込み
        <input id="filter" type="search" placeholder="氏名・受注番号など">
      </label>
      <label class="check-inline">
        <input id="all-cols" type="checkbox">
        TSV全列を表示
      </label>
      <button id="download" type="button" disabled>選択したPDFを連結してダウンロード</button>
    </div>
    <div class="client-filters">
      <label>クライアント名</label>
      <div id="client-filters" class="client-filters-list"></div>
    </div>
    <p id="meta" class="meta">読み込み中...</p>
    <p id="status" class="status"></p>
    <p id="error" class="error" hidden></p>
  </header>
  <main>
    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
  <script>
    window.addEventListener("error", (event) => {
      const el = document.getElementById("error");
      if (!el) return;
      el.hidden = false;
      el.textContent = `JavaScriptエラー: ${event.message}`;
    });

    const PRIMARY_HEADERS = [
      "訪問日", "受付番号", "終了日時", "クライアント名", "担当", "受付種別",
      "クライアント請求額", "現金", "売掛金",
      "完了報告書送付状態", "状態"
    ];
    const RIGHT_ALIGN_HEADERS = new Set(["クライアント請求額", "現金", "売掛金"]);

    const state = {
      dates: [],
      latest: null,
      date: "",
      headers: [],
      rows: [],
      extraPdfs: [],
      tsv: null,
      selected: new Set(),
      clients: [],
      selectedClients: new Set(),
      sortKey: "",
      sortDir: "asc"
    };

    const els = {
      date: document.getElementById("date-select"),
      filter: document.getElementById("filter"),
      allCols: document.getElementById("all-cols"),
      download: document.getElementById("download"),
      meta: document.getElementById("meta"),
      status: document.getElementById("status"),
      error: document.getElementById("error"),
      thead: document.getElementById("thead"),
      tbody: document.getElementById("tbody"),
      clients: document.getElementById("client-filters")
    };

    function showError(message) {
      els.error.hidden = !message;
      els.error.textContent = message || "";
    }

    function apiUrl(path) {
      return new URL(path, window.location.origin).toString();
    }

    async function api(path, options) {
      const res = await fetch(apiUrl(path), {
        credentials: "same-origin",
        ...options
      });
      if (res.status === 401) {
        throw new Error("基本認証に失敗しました。ユーザーとパスワードを確認してください。");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `API error ${res.status}`);
      }
      return data;
    }

    function visibleHeaders() {
      if (els.allCols.checked || !state.headers.length) return state.headers;
      return PRIMARY_HEADERS.filter((name) => state.headers.includes(name));
    }

    function clientNameOf(row) {
      return ((row && row["クライアント名"]) || "").trim();
    }

    function collectClients(rows) {
      const names = new Set();
      (rows || []).forEach((row) => {
        if (!row._has_pdf) return;
        const name = clientNameOf(row);
        if (name) names.add(name);
      });
      return [...names].sort((a, b) => a.localeCompare(b, "ja"));
    }

    function allClientValues() {
      return new Set(state.clients);
    }

    function renderClientFilters() {
      const parts = [
        `<label><input type="checkbox" value="" ${state.selectedClients.has("") ? "checked" : ""}>（空白）</label>`
      ];
      state.clients.forEach((name) => {
        parts.push(
          `<label><input type="checkbox" value="${escapeAttr(name)}" ${state.selectedClients.has(name) ? "checked" : ""}>${escapeHtml(name)}</label>`
        );
      });
      els.clients.innerHTML = parts.join("");
    }

    function matchesClient(row, extraPdf) {
      if (state.selectedClients.size === 0) return true;
      const name = extraPdf ? "" : clientNameOf(row);
      return state.selectedClients.has(name);
    }

    function clearHiddenPdfSelection() {
      state.rows.forEach((row) => {
        if (matchesClient(row, "")) return;
        (row._pdfs || []).forEach((name) => state.selected.delete(name));
      });
      state.extraPdfs.forEach((name) => {
        if (matchesClient(null, name)) return;
        state.selected.delete(name);
      });
    }

    function rowMatches(row, query) {
      if (!row._has_pdf) return false;
      if (!matchesClient(row, "")) return false;
      if (!query) return true;
      const hay = Object.values(row).join(" ").toLowerCase();
      return hay.includes(query);
    }

    function parseSortNumber(value) {
      const text = String(value ?? "").replace(/,/g, "").trim();
      if (!text) return null;
      const num = Number(text);
      return Number.isFinite(num) ? num : null;
    }

    function sortValue(row, key) {
      if (key === "_pdf") return (row._pdfs || []).join(",");
      return row[key] || "";
    }

    function compareRows(a, b) {
      const key = state.sortKey;
      if (!key) return 0;
      const dir = state.sortDir === "desc" ? -1 : 1;
      const va = sortValue(a, key);
      const vb = sortValue(b, key);
      if (RIGHT_ALIGN_HEADERS.has(key)) {
        const na = parseSortNumber(va);
        const nb = parseSortNumber(vb);
        if (na === null && nb === null) return 0;
        if (na === null) return 1;
        if (nb === null) return -1;
        if (na !== nb) return (na - nb) * dir;
      }
      return String(va).localeCompare(String(vb), "ja", { numeric: true }) * dir;
    }

    function displayRows() {
      const query = els.filter.value.trim().toLowerCase();
      const rows = state.rows
        .map((row, index) => ({ row, index }))
        .filter(({ row }) => rowMatches(row, query));
      if (state.sortKey) {
        rows.sort((left, right) => compareRows(left.row, right.row) || (left.index - right.index));
      }
      return rows;
    }

    function sortMark(key) {
      if (state.sortKey !== key) return "";
      return state.sortDir === "desc" ? "▼" : "▲";
    }

    function headerCell(label, key, extraClass) {
      const classes = ["sortable"];
      if (extraClass) classes.push(extraClass);
      if (RIGHT_ALIGN_HEADERS.has(key)) classes.push("col-num");
      return `<th class="${classes.join(" ")}" data-sort="${escapeAttr(key)}">${escapeHtml(label)}<span class="sort-mark">${sortMark(key)}</span></th>`;
    }

    function selectedCount() {
      return state.selected.size;
    }

    function updateDownloadState() {
      const count = selectedCount();
      els.download.disabled = count === 0;
      els.download.textContent = count
        ? `選択したPDFを連結してダウンロード（${count}件）`
        : "選択したPDFを連結してダウンロード";
    }

    function render() {
      const headers = visibleHeaders();
      const rows = displayRows();
      const headCells = [
        `<th class="col-check"><input id="select-all" type="checkbox" title="全選択 / 全クリア" aria-label="全選択 / 全クリア"></th>`,
        headerCell("PDF", "_pdf", "col-pdf"),
        ...headers.map((name) => headerCell(name, name))
      ];
      els.thead.innerHTML = `<tr>${headCells.join("")}</tr>`;

      const parts = [];
      let visibleSelected = 0;

      rows.forEach(({ row, index }) => {
        const pdfs = row._pdfs || [];
        const checked = pdfs.some((name) => state.selected.has(name));
        if (checked) visibleSelected += 1;
        parts.push(`<tr class="${checked ? "selected" : ""}" data-kind="row" data-index="${index}">`);
        parts.push(`<td class="col-check"><input type="checkbox" ${checked ? "checked" : ""} data-kind="row" data-index="${index}"></td>`);
        parts.push(`<td class="col-pdf">${pdfLinks(pdfs)}</td>`);
        headers.forEach((name) => {
          const cls = RIGHT_ALIGN_HEADERS.has(name) ? ' class="col-num"' : "";
          parts.push(`<td${cls} title="${escapeAttr(row[name] || "")}">${escapeHtml(row[name] || "")}</td>`);
        });
        parts.push("</tr>");
      });

      els.tbody.innerHTML = parts.join("") || `<tr><td colspan="${headers.length + 2}">該当する行がありません</td></tr>`;
      const selectAll = document.getElementById("select-all");
      if (selectAll) {
        selectAll.disabled = rows.length === 0;
        selectAll.checked = rows.length > 0 && visibleSelected === rows.length;
        selectAll.indeterminate = visibleSelected > 0 && visibleSelected < rows.length;
      }
      updateDownloadState();
    }

    function toggleRow(index, checked) {
      const pdfs = (state.rows[index] && state.rows[index]._pdfs) || [];
      pdfs.forEach((name) => checked ? state.selected.add(name) : state.selected.delete(name));
    }

    function visiblePdfs() {
      const names = [];
      displayRows().forEach(({ row }) => {
        (row._pdfs || []).forEach((name) => names.push(name));
      });
      return names;
    }

    async function loadDates() {
      const data = await api("/api/dates");
      state.dates = data.dates || [];
      state.latest = data.latest || "";
      els.date.innerHTML = state.dates.map((date) => {
        const label = `${date.slice(0, 4)}-${date.slice(4, 6)}-${date.slice(6, 8)}`;
        return `<option value="${date}">${label}</option>`;
      }).join("");
      if (!state.dates.length) {
        els.meta.textContent = "日付ディレクトリがありません";
        return;
      }
      els.date.value = state.latest;
      await loadItems(state.latest);
    }

    async function loadItems(date) {
      showError("");
      els.status.textContent = "";
      els.meta.textContent = `${date} を読み込み中...`;
      const data = await api(`/api/items?date=${encodeURIComponent(date)}`);
      state.date = data.date;
      state.headers = data.headers || [];
      state.rows = data.rows || [];
      state.extraPdfs = data.extra_pdfs || [];
      state.tsv = data.tsv;
      state.selected = new Set();
      state.sortKey = "";
      state.sortDir = "asc";
      state.clients = collectClients(state.rows);
      state.selectedClients = allClientValues();
      renderClientFilters();
      const withPdf = state.rows.filter((row) => row._has_pdf).length;
      const noPdf = state.rows.length - withPdf;
      els.meta.textContent = [
        `日付 ${formatDate(date)}`,
        formatUpload(data.latest_upload),
        data.tsv ? `TSV ${data.tsv}` : "TSVなし",
        `表示 ${withPdf}`,
        noPdf ? `PDFなし除外 ${noPdf}` : null,
        state.extraPdfs.length ? `TSV外PDF除外 ${state.extraPdfs.length}` : null
      ].filter(Boolean).join(" / ");
      render();
    }

    function pdfLinks(pdfs) {
      return pdfs.map((name) => (
        `<a href="#" class="pdf-link" data-pdf="${escapeAttr(name)}">${escapeHtml(name)}</a>`
      )).join("<br>");
    }

    async function downloadOne(name) {
      els.status.textContent = `${name} を準備しています...`;
      showError("");
      const data = await api("/api/file", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ date: state.date, pdf: name })
      });
      els.status.textContent = "ダウンロードを開始します。";
      const a = document.createElement("a");
      a.href = apiUrl(data.url);
      a.download = data.filename || name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function downloadSelected() {
      const pdfs = Array.from(state.selected);
      if (!pdfs.length) return;
      els.download.disabled = true;
      els.status.textContent = "PDFを連結しています...";
      showError("");
      try {
        const data = await api("/api/download", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ date: state.date, pdfs })
        });
        els.status.textContent = `${data.count}件を連結しました。ダウンロードを開始します。`;
        const a = document.createElement("a");
        a.href = apiUrl(data.url);
        a.download = data.filename || `esmile009-${state.date}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        showError(err.message);
        els.status.textContent = "";
      } finally {
        updateDownloadState();
      }
    }

    function formatDate(value) {
      return `${value.slice(0, 4)}-${value.slice(4, 6)}-${value.slice(6, 8)}`;
    }

    function formatUpload(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const parts = new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).formatToParts(date);
      const get = (type) => (parts.find((part) => part.type === type) || {}).value;
      return `最終アップロード ${get("year")}-${get("month")}-${get("day")} ${get("hour")}:${get("minute")}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('"', "&quot;");
    }

    els.date.addEventListener("change", () => {
      loadItems(els.date.value).catch((err) => showError(err.message));
    });
    els.filter.addEventListener("input", render);
    els.allCols.addEventListener("change", render);
    els.clients.addEventListener("change", (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement)) return;
      if (input.checked) state.selectedClients.add(input.value);
      else state.selectedClients.delete(input.value);
      clearHiddenPdfSelection();
      render();
    });
    els.thead.addEventListener("click", (event) => {
      if (event.target.closest("input")) return;
      const th = event.target.closest("th[data-sort]");
      if (!th) return;
      const key = th.dataset.sort;
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = key;
        state.sortDir = "asc";
      }
      render();
    });
    els.thead.addEventListener("change", (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || input.id !== "select-all") return;
      const names = visiblePdfs();
      if (input.checked) names.forEach((name) => state.selected.add(name));
      else names.forEach((name) => state.selected.delete(name));
      render();
    });
    els.tbody.addEventListener("click", (event) => {
      const link = event.target.closest("a.pdf-link");
      if (!link) return;
      event.preventDefault();
      downloadOne(link.dataset.pdf).catch((err) => {
        showError(err.message);
        els.status.textContent = "";
      });
    });
    els.tbody.addEventListener("change", (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement)) return;
      if (input.dataset.kind === "row") toggleRow(Number(input.dataset.index), input.checked);
      render();
    });
    els.download.addEventListener("click", () => {
      downloadSelected().catch((err) => showError(err.message));
    });

    loadDates().catch((err) => {
      els.meta.textContent = "";
      showError(err.message);
    });
  </script>
</body>
</html>
